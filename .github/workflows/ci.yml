name: CI

on:
  pull_request:
  push:
    branches: [development, staging, main]

permissions:
  contents: read

# A newer push to a pull request cancels its older run. Runs for pushes to
# development, staging and main are never cancelled, so every merged commit
# keeps a complete result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Every tool is a pinned release binary checked against its SHA256 before it
# runs.
env:
  ACTIONLINT_VERSION: 1.7.12
  ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
  # gitleaks is MIT licensed. Bump the version and its hash together, and
  # only to a release at least 14 days old.
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
  # markdownlint-cli2@0.23.3 (MIT), locked with its whole dependency tree in
  # tools/markdownlint/package-lock.json, with katex, markdown-it and
  # smol-toml raised by npm overrides past their advisories. Bump the version
  # and the overrides together.
  MARKDOWNLINT_CLI2_VERSION: 0.23.3
  NODE_VERSION: 24.21.0

jobs:
  # Repository checks that need no tools beyond the runner's shell.
  checks:
    name: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        shell: bash --noprofile --norc -euo pipefail {0}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The template every pull request starts from must keep asking for the
      # linked issue, tests, docs, the checklist and the required reviews.
      - name: Check the pull request template
        run: |
          scripts/check-pr-template.sh
          scripts/check-pr-template.test.sh

  # Scans the whole history, not only the change, so it checks out every
  # commit. A key that was committed and later deleted, or added in a merge
  # resolution, still fails.
  secrets:
    name: secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        shell: bash --noprofile --norc -euo pipefail {0}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Lint workflows
        run: |
          tarball="${RUNNER_TEMP}/actionlint.tar.gz"
          curl -fsSLo "$tarball" "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  $tarball" | sha256sum --check --strict
          tar -xzf "$tarball" -C "${RUNNER_TEMP}" actionlint
          rm "$tarball"
          "${RUNNER_TEMP}/actionlint" -color

      - name: Install gitleaks
        run: |
          mkdir -p "${RUNNER_TEMP}/gitleaks"
          tarball="${RUNNER_TEMP}/gitleaks.tar.gz"
          curl -fsSLo "$tarball" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $tarball" | sha256sum --check --strict
          tar -xzf "$tarball" -C "${RUNNER_TEMP}/gitleaks" gitleaks
          rm "$tarball"
          version=$("${RUNNER_TEMP}/gitleaks/gitleaks" version)
          [ "$version" = "${GITLEAKS_VERSION}" ] || { echo "gitleaks is $version, not ${GITLEAKS_VERSION}" >&2; exit 1; }
          echo "${RUNNER_TEMP}/gitleaks" >> "$GITHUB_PATH"

      # On pull requests the rules come from the base branch, so a change
      # cannot loosen the rules its own scan runs with. Empty on pushes.
      - name: Scan the full history for secrets
        env:
          SECRET_SCAN_BASE_REF: ${{ github.base_ref }}
        run: scripts/secret-scan.sh

      # Plants generated fake keys in throwaway repos and checks the scan
      # fails on each, so a config change cannot quietly stop detection.
      - name: Test the secret scan
        if: ${{ !cancelled() }}
        run: scripts/secret-scan.test.sh

  # Lints every Markdown file with the repository config.
  markdownlint:
    name: markdownlint
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        shell: bash --noprofile --norc -euo pipefail {0}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: tools/markdownlint/package-lock.json

      # Installs exactly the lockfile, and no package gets to run install
      # scripts.
      - name: Install markdownlint-cli2
        working-directory: tools/markdownlint
        run: |
          node --version | grep -qx "v${NODE_VERSION}" || { echo "node is not ${NODE_VERSION}" >&2; exit 1; }
          npm ci --ignore-scripts --no-audit --no-fund
          # Read from the installed package, since the tool's --help exits
          # non-zero.
          version=$(node -p 'require("./node_modules/markdownlint-cli2/package.json").version')
          echo "markdownlint-cli2 $version"
          [ "$version" = "${MARKDOWNLINT_CLI2_VERSION}" ] || { echo "markdownlint-cli2 is not ${MARKDOWNLINT_CLI2_VERSION}" >&2; exit 1; }

      - name: Lint Markdown
        run: tools/markdownlint/node_modules/.bin/markdownlint-cli2

      # Fails on any advisory in the locked tree that is not in the reviewed
      # accepted list, and on an accepted one that is no longer reported.
      - name: Audit the markdownlint dependencies
        run: |
          code=0
          (cd tools/markdownlint && npm audit --json) >"${RUNNER_TEMP}/audit.json" || code=$?
          # npm audit exits 1 when it reports any advisory; anything else is a failure to run.
          if [ "$code" -gt 1 ]; then
            cat "${RUNNER_TEMP}/audit.json"
            exit "$code"
          fi
          scripts/check-npm-audit.py "${RUNNER_TEMP}/audit.json" tools/markdownlint/audit-accepted.json

      - name: Test the audit check
        run: scripts/test-check-npm-audit.sh

  # Fails on any em dash or en dash in a tracked file's content or its path.
  # The same scripts run in every UJIRA repository. The self test runs first,
  # so the check's result is only trusted once the check is known to fail when
  # it should, and the second step reports even when the first fails.
  dashes:
    name: dashes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        shell: bash --noprofile --norc -euo pipefail {0}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test the dash check
        run: scripts/test-check-dashes.sh

      - name: Check for dashes
        if: ${{ !cancelled() }}
        run: scripts/check-dashes.sh

  invisible-characters:
    name: invisible-characters
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        shell: bash --noprofile --norc -euo pipefail {0}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check invisible characters
        run: scripts/check-invisible-characters.py

      - name: Test the invisible character check
        run: scripts/test-check-invisible-characters.sh

  # Every relative link and heading anchor must resolve inside the repository.
  # External URLs are never fetched.
  links:
    name: links
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        shell: bash --noprofile --norc -euo pipefail {0}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check links
        run: scripts/check-links.py

      - name: Test the link check
        run: scripts/test-check-links.sh
